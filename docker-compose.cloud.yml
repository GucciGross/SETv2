# Managed multi-tenant SET Cloud, NOT simply a public self-hosted installation.
# Public self-hosting uses docker-compose.hosted.yml instead.
# docker compose -f docker-compose.yml -f docker-compose.cloud.yml --profile cloud up -d
services:
  server:
    build:
      target: runtime
    environment:
      SET_DEPLOYMENT_MODE: cloud
      SET_EXPOSURE: public
      SET_CODEX_OAUTH_ENABLED: "0"
      SET_CODEX_VOICE_ENABLED: "0"
      JWT_SECRET: ${JWT_SECRET:-}
      APP_URL: ${APP_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-0}
      SET_TRUST_PROXY: ${SET_TRUST_PROXY:-}
      SET_BUILD_REVISION: ${SET_BUILD_REVISION:-unknown}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SET <noreply@trainwithset.com>}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      HF_TOKEN: ${HF_TOKEN:-}
      WANDGX_URL: ${WANDGX_URL:-}
      WANDGX_TOKEN: ${WANDGX_TOKEN:-}
      WANDGX_WEBHOOK_SECRET: ${WANDGX_WEBHOOK_SECRET:-}
      SEED_DEMO: "0"
      # Platform secrets stay in the gateway, never tenant-editable providers.
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_CHAT_MODEL: ""
      LLM_EMBED_MODEL: ""
      GATEWAY_URL: http://gateway:4100/v1

  gateway:
    build: ./gateway
    profiles: ["cloud"]
    environment:
      DATABASE_URL: postgres://set:${POSTGRES_PASSWORD:-set}@db:5432/set
      SET_DEPLOYMENT_MODE: cloud
      GATEWAY_UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:-${LLM_BASE_URL:-}}
      GATEWAY_UPSTREAM_KEY: ${GATEWAY_UPSTREAM_KEY:-${LLM_API_KEY:-}}
      GATEWAY_PRICES: ${GATEWAY_PRICES:-{}}
      GATEWAY_RATE_LIMIT_PER_MIN: ${GATEWAY_RATE_LIMIT_PER_MIN:-120}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
