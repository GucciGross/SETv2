# Disposable CI stack only. Never attach production volumes or credentials.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: set
      POSTGRES_PASSWORD: set
      POSTGRES_DB: set
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U set']
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    image: set-server
    environment:
      DATABASE_URL: postgres://set:set@db:5432/set
      DATA_DIR: /app/data
      JWT_SECRET: disposable-h5p-regression-only-not-production
      SEED_DEMO: '1'
      WEB_ORIGIN: '*'
      APP_URL: ''
      TELEMETRY_ENABLED: '0'
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:4000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 2s
      timeout: 3s
      retries: 40
  web:
    image: set-web
    ports: ['127.0.0.1:8088:80']
    depends_on:
      server:
        condition: service_healthy
  web-tls:
    image: set-web
    environment:
      SET_TLS: '1'
    ports: ['127.0.0.1:8448:443']
    depends_on:
      server:
        condition: service_healthy
