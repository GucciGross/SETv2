name: Apply reviewed Home Screen patch
on:
  push:
    branches: [fix/home-screen-viewport-paint-20260911]
    paths: [.github/workflows/apply-home-screen-layout.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'GucciGross/SETv2' && github.ref == 'refs/heads/fix/home-screen-viewport-paint-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply scoped layout changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''''''
          data = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest() == '1e912e3ab9e2ba6c8da6e72085329c83b5e83e598104df68b6cb8f27049a6572'
          Path('/tmp/home-screen.patch').write_bytes(data)
          PY
          git apply --check /tmp/home-screen.patch
          git apply --index /tmp/home-screen.patch
          if git diff --cached --name-only | grep -vE '^(web/|docs/HOME_SCREEN_LAYOUT.md$|.github/workflows/ci.yml$)'; then exit 1; fi
          git diff --cached --check
          git rm .github/workflows/apply-home-screen-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: let Home Screen CSS own viewport and keep footer inside paintable bounds'
          git push origin HEAD:refs/heads/fix/home-screen-viewport-paint-20260911
