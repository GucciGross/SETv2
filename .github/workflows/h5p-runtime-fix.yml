name: H5P runtime corrections
on:
  push:
    branches: [feat/h5p-studio-20260908]
    paths: [.github/workflows/h5p-runtime-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/h5p-studio-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h5p-studio-20260908
      - name: Apply exact application-source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new):
              path = Path(file)
              source = path.read_text()
              assert source.count(old) == 1, f'Unexpected source in {file}'
              path.write_text(source.replace(old, new))
          replace('server/src/index.ts', 'Fastify({ logger: true, bodyLimit: 64 * 1024 * 1024 })', 'Fastify({ logger: true, bodyLimit: 64 * 1024 * 1024, maxParamLength: 2048 })')
          replace('server/src/h5p/runtime.ts', "settings.contentUserStateSaveInterval = scope.mode === 'play' ? 10_000 : 0;", "// Native H5P treats zero as a one-second interval; false disables preview autosave.\n  settings.contentUserStateSaveInterval = scope.mode === 'play' ? 10_000 : false;")
          replace('server/test/h5p.test.ts', "    assert.match(String(await preview.player.render(content, preview.user, 'en')), /Hello Studio/);", "    assert.match(String(await preview.player.render(content, preview.user, 'en')), /Hello Studio/);\n    preview.player.setRenderer((model) => model);\n    assert.equal((await preview.player.render(content, preview.user, 'en') as any).integration.saveFreq, false);")
          PY
      - name: Commit application sources to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/index.ts server/src/h5p/runtime.ts server/test/h5p.test.ts
          git diff --cached --check
          git commit -m 'fix(h5p): route scoped launch capabilities and disable preview autosave'
          git push origin HEAD:refs/heads/feat/h5p-studio-20260908
