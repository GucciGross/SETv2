name: Prepare official H5P bundle
on:
  push:
    branches: [fix/h5p-native-studio-provisioning]
    paths: [.github/workflows/h5p-review-snapshot.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: server
      - name: Resolve official Hub packages and verify dependency closure
        run: node scripts/update-h5p-bundle.mjs
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: set-official-h5p-bundle
          path: server/h5p
          retention-days: 3
