name: H5P dependency preparation
on:
  push:
    branches: [feat/h5p-studio-20260908]
    paths: [.github/workflows/h5p-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve pinned H5P dependency
        working-directory: server
        run: npm install --save-exact --ignore-scripts @lumieducation/h5p-server@10.0.4
      - name: Install frontend build dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Package verification dependencies
        run: |
          mkdir -p /tmp/h5p-review
          tar -czf /tmp/h5p-review/server-dependencies.tar.gz -C server node_modules
          tar -czf /tmp/h5p-review/web-dependencies.tar.gz -C web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: h5p-build-dependencies
          path: /tmp/h5p-review
          retention-days: 1
