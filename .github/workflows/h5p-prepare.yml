name: H5P dependency preparation
on:
  push:
    branches: [feat/h5p-studio-20260908]
    paths: [.github/workflows/h5p-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned official browser assets
        run: |
          mkdir -p /tmp/h5p-assets
          curl --fail --location --retry 2 https://codeload.github.com/h5p/h5p-php-library/zip/829524eaf81fe3f3a295d0e843812be4735f51fc -o /tmp/core.zip
          curl --fail --location --retry 2 https://codeload.github.com/h5p/h5p-editor-php-library/zip/80b3b281ee9d064b563f242e8ee7a0026b5bf205 -o /tmp/editor.zip
          unzip -q /tmp/core.zip -d /tmp/h5p-assets
          unzip -q /tmp/editor.zip -d /tmp/h5p-assets
          mv /tmp/h5p-assets/h5p-php-library-* /tmp/h5p-assets/core
          mv /tmp/h5p-assets/h5p-editor-php-library-* /tmp/h5p-assets/editor
      - uses: actions/upload-artifact@v4
        with:
          name: h5p-browser-assets
          path: /tmp/h5p-assets
          retention-days: 1
