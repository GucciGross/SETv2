name: H5P targeted verification fixes
on:
  push:
    branches: [feat/h5p-studio-20260908]
    paths: [.github/workflows/h5p-prepare.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/h5p-studio-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h5p-studio-20260908
      - name: Apply exact application-source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new, count=1):
              path = Path(file)
              source = path.read_text()
              assert source.count(old) == count, f'Unexpected source in {file}'
              path.write_text(source.replace(old, new))
          replace('server/src/mcp/tools.ts', 'annotations: { title: t.title, ...(t.annotations ?? {}) },', "annotations: { title: t.title, readOnlyHint: t.scope === 'mcp:read', ...(t.annotations ?? {}) },")
          replace('server/mcp-smoke.mjs', "const BASE = 'http://localhost:4000/api';", "import { TOOLS } from './dist/mcp/tools.js';\nconst expectedToolNames = TOOLS.map((tool) => tool.name).sort();\nconst matchesCatalog = (tools) => JSON.stringify((tools ?? []).map((tool) => tool.name).sort()) === JSON.stringify(expectedToolNames);\nconst BASE = 'http://localhost:4000/api';")
          replace('server/mcp-smoke.mjs', "check('26 tools exposed', tools.length === 26, String(tools.length));", "check('all registered tools exposed exactly once', matchesCatalog(tools), String(tools.length));")
          replace('server/mcp-smoke.mjs', "doc.tools?.length === 26 && doc.auth?.flow?.includes('PKCE')", "matchesCatalog(doc.tools) && doc.auth?.flow?.includes('PKCE')")
          replace('server/Dockerfile', 'node:20-alpine', 'node:22-alpine', 2)
          replace('web/Dockerfile', 'node:20-alpine', 'node:22-alpine')
          replace('server/Dockerfile', 'RUN npm run build\n', 'RUN npm run build && mkdir -p dist/importers/data && if [ -d src/importers/data ]; then cp -R src/importers/data/. dist/importers/data/; fi\n')
          replace('server/Dockerfile', 'COPY --from=build /app/src/importers/data ./dist/importers/data\n', '')
          replace('server/h5p-smoke.mjs', "import assert from 'node:assert/strict';", "import assert from 'node:assert/strict';\nimport { execFileSync } from 'node:child_process';")
          replace('server/h5p-smoke.mjs', '  console.log(`H5P integration: ${checks} checks passed`);', "  if (process.env.H5P_BROWSER_TEST === '1') execFileSync('python3', ['h5p-browser-smoke.py'], { stdio: 'inherit', env: { ...process.env, H5P_TEST_TOKEN: token, H5P_TEST_SPACE: testSpace } });\n  console.log(`H5P integration: ${checks} checks passed`);")
          PY
      - name: Commit only application sources to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/mcp/tools.ts server/mcp-smoke.mjs server/h5p-smoke.mjs server/Dockerfile web/Dockerfile
          git diff --cached --check
          git commit -m 'fix(h5p): align MCP catalog checks, Node runtime and Docker assets; exercise native browser'
          git push origin HEAD:refs/heads/feat/h5p-studio-20260908
