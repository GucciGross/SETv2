name: Apply mobile repair
on:
  push:
    branches: [fix/iphone-viewport-voice-ai-setup-20260911]
    paths: [.github/workflows/mobile-repair-transfer.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'GucciGross/SETv2' && github.ref == 'refs/heads/fix/iphone-viewport-voice-ai-setup-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply source-only patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .set-mobile-transfer
          cat .set-mobile-transfer/*.b64 | base64 --decode | gzip --decompress > /tmp/mobile.patch
          echo '5efb3f33db2c614300d9d7b80f5c6aa8d25e1cc1887559a74345d2474aa29894  /tmp/mobile.patch' | sha256sum --check
          git apply --check /tmp/mobile.patch
          git apply --index /tmp/mobile.patch
          if git diff --cached --name-only | grep -vE '^(web/|server/)'; then exit 1; fi
          git diff --cached --check
          git rm -r .set-mobile-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: adapt iPhone viewport, start voice from tap, expose AI connections'
          git push origin HEAD:refs/heads/fix/iphone-viewport-voice-ai-setup-20260911
