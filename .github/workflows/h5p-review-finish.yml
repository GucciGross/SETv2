name: Apply reviewed native editor regressions
on:
  push:
    branches: [fix/h5p-native-composite-regressions]
    paths: [.github/workflows/h5p-review-finish.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/h5p-native-composite-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h5p-native-composite-regressions
      - name: Apply checksummed source corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GucciGross/SETv2/git/blobs/5bbe74178c2094b45fefcd4ece694b1255febed8 --jq .content | base64 --decode | xz --decompress > /tmp/native-followup.patch
          echo 'f5fe77eb957eb6e683bd53a4a513011ac87fdb748bab488dee73ae91ef39e2e3  /tmp/native-followup.patch' | sha256sum --check
          git apply --check /tmp/native-followup.patch
          git apply /tmp/native-followup.patch
      - name: Commit only to the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server web
          git diff --cached --check
          git commit -m 'fix(h5p): scope composite widget styles, preserve restrictions and verify rendered phone forms'
          git push origin HEAD:refs/heads/fix/h5p-native-composite-regressions
