name: Apply H5P diagnostic correction
on:
  push:
    branches: [fix/h5p-native-composite-regressions]
    paths: [.github/workflows/h5p-diagnostics-correction.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/h5p-native-composite-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h5p-native-composite-regressions
      - name: Preserve transport diagnostics without treating navigation aborts as HTTP statuses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/h5p-deployment-smoke.py')
          text = p.read_text()
          for old, new in [
              ('    pending = {}\n', '    pending = {}\n    transport_errors = []\n'),
              ('pending.pop(id(req), None), failed.append({"url": redact(req.url), "error": req.failure})', 'pending.pop(id(req), None), transport_errors.append({"url": redact(req.url), "error": req.failure})'),
              ('"pending": list(pending.values()), "console":', '"pending": list(pending.values()), "transportErrors": transport_errors, "console":'),
          ]:
              assert text.count(old) == 1
              text = text.replace(old, new)
          p.write_text(text)
          PY
          python3 -m py_compile server/h5p-deployment-smoke.py
      - name: Commit only to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/h5p-deployment-smoke.py
          git diff --cached --check
          git commit -m 'test(h5p): keep aborted navigation requests in diagnostic transport records'
          git push origin HEAD:refs/heads/fix/h5p-native-composite-regressions
