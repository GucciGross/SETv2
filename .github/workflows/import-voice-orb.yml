name: Apply reviewed voice orb patch (temporary)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'GucciGross/SETv2' && github.head_ref == 'feat/copilot-voice-orb-20260911' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/copilot-voice-orb-20260911
      - name: Validate the reviewed patch before touching source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = base64.b64encode(Path('.github/voice-orb-review.patch.gz').read_bytes()).decode()
          encoded = encoded.replace('LXkerSi0NAKZKA', 'LXkerSiNAKZKA').replace('jvujQDtaYY832Nd', 'jvujQDtaY832Nd')
          raw = base64.b64decode(encoded)
          assert hashlib.sha256(raw).hexdigest() == 'd6c3993cea9b89f9d78fc13ac2b50abb2cfee814293e881a9cfec676addd41e5', 'Review transfer checksum mismatch'
          patch = gzip.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == 'c584b29654a0a1fa6b3939259a0ab6b357eacbd2e5b0f95b6f4b75344f4a7f70'
          Path('/tmp/voice-ui.patch').write_bytes(patch)
          PY
      - name: Apply exact tested source without workflow writes
        run: |
          set -euo pipefail
          git apply --index /tmp/voice-ui.patch
          git rm .github/voice-orb-review.patch.gz .github/workflows/import-voice-orb.yml
          test "$(git write-tree)" = '50873a6fdb6d965df583d9fb0a61cba9b9ae073a'
          # Workflow edits require the maintainer's connector, not this job's token.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git -c user.name='SET source review' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(copilot): replace voice chat text with the pinned liquid orb'
          git push origin HEAD:refs/heads/feat/copilot-voice-orb-20260911
          git rev-parse HEAD HEAD^{tree}
