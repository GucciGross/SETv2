name: Apply reviewed H5P loading diagnostics
on:
  push:
    branches: [fix/h5p-native-composite-regressions]
    paths: [.github/workflows/h5p-loading-diagnostics.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/h5p-native-composite-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h5p-native-composite-regressions
      - name: Apply verified source diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GucciGross/SETv2/git/blobs/af37f05150f8339b2e8ce41696bc4159eb301cec --jq .content | base64 --decode | xz --decompress > /tmp/loading.patch
          echo '7993123c03a1825404093ce6d4670f7b54385b657b83ed0a320a31d51ed1997b  /tmp/loading.patch' | sha256sum --check
          git apply --check /tmp/loading.patch
          git apply /tmp/loading.patch
          python3 -m py_compile server/h5p-deployment-smoke.py
      - name: Commit only to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/h5p-deployment-smoke.py
          git diff --cached --check
          git commit -m 'test(h5p): record redacted transport and library loading state on browser failure'
          git push origin HEAD:refs/heads/fix/h5p-native-composite-regressions
