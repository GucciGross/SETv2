name: Apply verified Home Screen repair
on:
  push:
    branches: [fix/home-screen-css-viewport-unclipped-dock]
    paths: [.github/workflows/apply-home-screen-source.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'GucciGross/SETv2' && github.ref == 'refs/heads/fix/home-screen-css-viewport-unclipped-dock'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/source.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/source.b64 | gzip --decompress > /tmp/source.patch
          echo '3a3108bd71f6ca33961d7ba390d776aa7b0da7807101ddfc159465f9e04bff00  /tmp/source.patch' | sha256sum --check
          git apply --check /tmp/source.patch
          git apply --index /tmp/source.patch
          if git diff --cached --name-only | grep -vE '^(web/|docs/)'; then exit 1; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use native Home Screen sizing and keep the dock inside its clipping parent'
          git push origin HEAD:refs/heads/fix/home-screen-css-viewport-unclipped-dock
