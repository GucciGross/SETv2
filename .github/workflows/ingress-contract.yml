name: Ingress contract
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  proxy:
    concurrency:
      group: setv2-docker-fixture
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build actual images
        run: |
          docker build -t set-server ./server
          docker build -t set-web ./web
      - run: |
          python3 -m venv "$RUNNER_TEMP/set-ingress-${{ github.run_id }}"
          echo "$RUNNER_TEMP/set-ingress-${{ github.run_id }}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/set-ingress-${{ github.run_id }}/bin/pip" install websockets==15.0.1
      - name: Verify HTTP and HTTPS routes through Nginx
        run: |
          set -euo pipefail
          compose=(docker compose -p set-ingress-regression -f server/test/h5p-compose.yml)
          trap '"${compose[@]}" down -v' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 120
          H5P_TEST_DATABASE=1 python3 server/ingress-smoke.py
