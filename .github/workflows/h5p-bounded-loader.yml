name: Apply reviewed H5P bounded loading
on:
  push:
    branches: [fix/h5p-native-composite-regressions]
    paths: [.github/workflows/h5p-bounded-loader.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/h5p-native-composite-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h5p-native-composite-regressions
      - name: Apply checksummed source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GucciGross/SETv2/git/blobs/b88a442ba389227cfaa6c8937f0c7af0ed2fc845 --jq .content | base64 --decode | xz --decompress > /tmp/bounded.patch
          echo '54fc0ef7d66bbbe2f5020159031feb50a22951d8848b559b56efc7d35fa0ee6c  /tmp/bounded.patch' | sha256sum --check
          git apply --check /tmp/bounded.patch
          git apply /tmp/bounded.patch
          python3 -m py_compile server/h5p-deployment-smoke.py
      - name: Commit only to the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/components/h5p server/h5p-deployment-smoke.py
          git diff --cached --check
          git commit -m 'fix(h5p): bound native dependency loading and recover from failed assets'
          git push origin HEAD:refs/heads/fix/h5p-native-composite-regressions
