name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: set, POSTGRES_PASSWORD: set, POSTGRES_DB: set }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U set" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: DATABASE_URL=postgres://set:set@localhost:5432/set npm run migrate
        working-directory: server
      - name: Smoke suite
        run: |
          DATABASE_URL=postgres://set:set@localhost:5432/set SEED_DEMO=1 DATA_DIR=./data node dist/index.js &
          sleep 15
          node smoke.mjs
        working-directory: server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t set-server ./server
      - name: Build web image
        run: docker build -t set-web ./web
      - name: Compose config check
        run: docker compose config --quiet
