name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  server:
    concurrency:
      group: setv2-api-fixture
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: set, POSTGRES_PASSWORD: set, POSTGRES_DB: set }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U set" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run h5p:verify
        working-directory: server
      - run: npm run h5p:setup
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
      - run: DATABASE_URL=postgres://set:set@localhost:5432/set npm run migrate
        working-directory: server
      - name: Install native browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}"
          export PATH="$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin:$PATH"
          echo "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin" >> "$GITHUB_PATH"
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Smoke suites (API + MCP + H5P)
        working-directory: server
        run: |
          set -euo pipefail
          export DATABASE_URL=postgres://set:set@localhost:5432/set
          export DATA_DIR="$RUNNER_TEMP/set-api-data-${{ github.run_id }}"
          SEED_DEMO=1 node dist/index.js > "$RUNNER_TEMP/set-api-${{ github.run_id }}.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health > /dev/null
          node smoke.mjs
          node mcp-smoke.mjs
          H5P_TEST_DATABASE=1 H5P_BROWSER_TEST=1 node h5p-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5p-native-browser
          path: /tmp/h5p-browser
          if-no-files-found: ignore
          retention-days: 3
  web:
    concurrency:
      group: setv2-web-fixture
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: node scripts/sync-orb.mjs
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Copilot browser regression dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}"
          export PATH="$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin:$PATH"
          echo "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin" >> "$GITHUB_PATH"
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      - name: Exercise approvals and input controls in the actual Copilot shell
        working-directory: web
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/set-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          python3 scripts/copilot-approval-smoke.py
          python3 scripts/copilot-controls-smoke.py
          python3 scripts/viewport-layout-smoke.py
          xvfb-run -a env SET_BROWSER_HEADED=1 SET_BROWSER_CHANNEL=chromium python3 scripts/voice-orb-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copilot-inline-approvals
          path: /tmp/copilot-approvals
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copilot-controls-browser
          path: /tmp/copilot-controls
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-orb-browser
          path: /tmp/voice-orb
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-layout-browser
          path: /tmp/viewport-layout
          if-no-files-found: error
          retention-days: 7
  docker:
    concurrency:
      group: setv2-docker-fixture
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build server image
        run: docker build -t set-server ./server
      - name: Build web image
        run: docker build -t set-web ./web
      - name: Compose config check
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.codex.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.hosted.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml config --quiet
      - name: Validate the optional self-hosted Codex image without credentials
        run: |
          docker build --target codex-self-hosted -t set-server-codex ./server
          docker run --rm -v "$PWD/server/scripts:/app/scripts:ro" --entrypoint node set-server-codex scripts/codex-cli-smoke.mjs
      - name: Install deployed-browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}"
          export PATH="$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin:$PATH"
          echo "$RUNNER_TEMP/set-python-${{ github.run_id }}-${{ github.job }}/bin" >> "$GITHUB_PATH"
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise the built deployment through HTTP and HTTPS Nginx
        run: |
          set -euo pipefail
          compose=(docker compose -p set-h5p-regression -f server/test/h5p-compose.yml)
          trap '"${compose[@]}" down -v' EXIT
          if ! "${compose[@]}" up -d --wait --wait-timeout 120; then
            "${compose[@]}" logs --no-color
            exit 1
          fi
          H5P_TEST_DATABASE=1 H5P_BROWSER_ARTIFACTS=/tmp/h5p-deployment/http python3 server/h5p-deployment-smoke.py
          "${compose[@]}" exec -T server sh -c 'find /app/data/h5p/spaces /app/data/h5p/libraries -type f -exec sha256sum {} + | sort' > /tmp/h5p-before.txt
          "${compose[@]}" up -d --force-recreate --no-deps --wait --wait-timeout 120 server
          "${compose[@]}" exec -T server sh -c 'find /app/data/h5p/spaces /app/data/h5p/libraries -type f -exec sha256sum {} + | sort' > /tmp/h5p-after.txt
          diff -u /tmp/h5p-before.txt /tmp/h5p-after.txt
          H5P_TEST_DATABASE=1 SET_DEPLOYMENT_BASE=https://localhost:8448 H5P_TEST_SELF_SIGNED=1 H5P_BROWSER_ARTIFACTS=/tmp/h5p-deployment/https python3 server/h5p-deployment-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5p-deployed-browser
          path: /tmp/h5p-deployment
          if-no-files-found: ignore
          retention-days: 3
