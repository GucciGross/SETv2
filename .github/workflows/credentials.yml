name: Credential boundaries
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked credential and runtime files
        run: |
          python3 scripts/ops/test-credential-boundaries.py
          python3 scripts/ops/check-credential-boundaries.py
          python3 scripts/ops/test-credential-build-contexts.py
      - name: Scan reachable Git history without exposing findings
        env:
          VERSION: '8.30.1'
          SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' "$SHA256" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
