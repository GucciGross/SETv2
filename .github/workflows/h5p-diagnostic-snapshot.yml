name: H5P diagnostic source snapshot
on:
  push:
    branches: [fix/h5p-production-20260908]
    paths: [.github/workflows/h5p-diagnostic-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: server
      - name: Exercise first-time official Hub installation in disposable storage
        working-directory: server
        run: |
          node --input-type=module <<'JS'
          import { randomUUID } from 'node:crypto';
          import { runtime } from './dist/h5p/runtime.js';
          const rt = await runtime({ spaceId: randomUUID(), user: { id: randomUUID(), name: 'Diagnostic', email: 'diagnostic@example.invalid' }, role: 'owner', mode: 'edit', readable: [], installFromHub: true });
          const catalog = await rt.editor.getContentTypeCache(rt.user);
          console.log('Official catalog entries:', catalog.libraries.length);
          for (const machineName of ['H5P.Blanks', 'H5P.Image']) {
            console.log('Installing', machineName);
            try { console.log(await rt.editor.installLibraryFromHub(machineName, rt.user)); }
            catch (error) { console.error(error.message); process.exitCode = 1; }
          }
          JS
      - name: Archive trusted library fixtures for offline regression tests
        if: always()
        run: |
          mkdir -p /tmp/h5p-diagnostics
          if [ -d server/data/h5p/libraries ]; then tar -czf /tmp/h5p-diagnostics/official-libraries.tar.gz -C server/data/h5p libraries; fi
          for host in trainwithset.com set.wandgx.com; do
            curl --max-time 15 --silent --show-error --location --dump-header /tmp/h5p-diagnostics/$host.headers https://$host/api/meta -o /tmp/h5p-diagnostics/$host.meta.json || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setv2-h5p-diagnostics
          path: /tmp/h5p-diagnostics
          retention-days: 1
