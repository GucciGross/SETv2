name: H5P catalog verification inputs
on:
  push:
    branches: [feat/h5p-native-studio-bundled-catalog]
    paths: [.github/workflows/h5p-catalog-prepare.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server
      - name: Fetch official Hub catalog and complete content-type packages
        working-directory: server
        run: |
          mkdir -p /tmp/h5p-review/packages /tmp/h5p-review/libraries /tmp/h5p-review/content /tmp/h5p-review/temporary
          node --input-type=module <<'JS'
          import * as H5P from '@lumieducation/h5p-server';
          import { writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const root='/tmp/h5p-review';
          const cache=new H5P.fsImplementations.InMemoryStorage();
          const config=await new H5P.H5PConfig(new H5P.fsImplementations.InMemoryStorage()).load();
          config.platformName='SET';config.sendUsageStatistics=false;
          const editor=new H5P.H5PEditor(cache,config,new H5P.fsImplementations.FileLibraryStorage(root+'/libraries'),new H5P.fsImplementations.FileContentStorage(root+'/content'),new H5P.fsImplementations.DirectoryTemporaryFileStorage(root+'/temporary'));
          const hub=await editor.contentTypeCache.downloadContentTypesFromHub();
          await writeFile(root+'/hub.json',JSON.stringify({contentTypes:hub},null,2));
          const report=[];
          for(const item of hub){
            try{
              let response=await fetch(config.hubContentTypesEndpoint+item.id,{signal:AbortSignal.timeout(90000)});
              if(!response.ok){
                const getStatus=response.status;
                response=await fetch(config.hubContentTypesEndpoint+item.id,{method:'POST',signal:AbortSignal.timeout(90000)});
                if(!response.ok)throw new Error('GET '+getStatus+'; POST '+response.status);
              }
              const parts=[];let size=0;
              for await(const part of response.body){size+=part.length;if(size>96*1024*1024)throw new Error('Package exceeds 96 MiB');parts.push(part);}
              const data=Buffer.concat(parts);if(data.subarray(0,2).toString()!=='PK')throw new Error('Not a ZIP package');
              await writeFile(root+'/packages/'+item.id+'.h5p',data);
              report.push({machineName:item.id,bytes:data.length,sha256:createHash('sha256').update(data).digest('hex')});
              console.log(item.id,data.length);
            }catch(error){report.push({machineName:item.id,error:error.message});console.log(item.id,error.message);}
          }
          await writeFile(root+'/report.json',JSON.stringify(report,null,2));
          console.log('Catalog',hub.length,'failures',report.filter(x=>x.error).length);
          JS
      - name: Package frontend integration source
        if: always()
        run: |
          cd /tmp/h5p-review
          npm pack @lumieducation/h5p-webcomponents@10.0.4 --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5p-catalog-inputs
          path: /tmp/h5p-review
          retention-days: 2
