server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets are immutable — cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing — the HTML entry must revalidate on every load, or phones
    # keep booting the previous build's hashed bundle after a deploy
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Liveness must return API JSON, never a successful SPA fallback.
    location = /health {
        proxy_pass http://server:4000/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Collaboration is registered under the server's /api prefix.
    location = /api/ws {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Preserve older clients using /ws, forwarding to the canonical route.
    location = /ws {
        proxy_pass http://server:4000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API proxy to the backend service
    location /api/ {
        # H5P accepts a 100 MiB package; allow multipart overhead at the proxy.
        # Per-route package/media/JSON limits remain enforced by the server.
        client_max_body_size 101m;
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support (grounded chat + agent streams)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
