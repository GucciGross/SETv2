# Served when SET_TLS=1: HTTPS with a self-signed (or mounted) certificate.
# Mobile browsers only expose the microphone / speech recognition on secure
# origins — plain HTTP on a LAN IP disables voice input (and iOS PWAs).
# Mount your own cert at /etc/nginx/certs/set.crt + set.key to avoid the
# self-signed warning.
server {
    listen 80;
    server_name _;
    return 301 https://$host:443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/set.crt;
    ssl_certificate_key /etc/nginx/certs/set.key;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend service
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support (grounded chat + agent streams)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # WebSocket (collab + presence)
    location /ws {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
