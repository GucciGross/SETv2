# Publicly reachable SELF-HOSTED installation; this does not enable SET Cloud.
# docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d --build
# TLS may terminate at your existing trusted reverse proxy. Preserve the data volumes.
services:
  server:
    environment:
      SET_DEPLOYMENT_MODE: self-hosted
      SET_EXPOSURE: public
      SET_CODEX_OAUTH_ENABLED: "1"
      JWT_SECRET: ${JWT_SECRET:-}
      APP_URL: ${APP_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-0}
      SET_PRIVATE_PREVIEW: ${SET_PRIVATE_PREVIEW:-0}
      SEED_DEMO: "0"
      SET_TRUST_PROXY: ${SET_TRUST_PROXY:-}
      SET_BUILD_REVISION: ${SET_BUILD_REVISION:-unknown}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SET <noreply@trainwithset.com>}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      HF_TOKEN: ${HF_TOKEN:-}
      WANDGX_URL: ${WANDGX_URL:-}
      WANDGX_TOKEN: ${WANDGX_TOKEN:-}
      WANDGX_WEBHOOK_SECRET: ${WANDGX_WEBHOOK_SECRET:-}
