# SET — Strategic Enablement Toolkit v2
# Self-hostable Knowledge + Learning OS. `docker compose up -d` and you're running.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: set
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-set}
      POSTGRES_DB: set
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U set -d set"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://set:${POSTGRES_PASSWORD:-set}@db:5432/set
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATA_DIR: /app/data
      WEB_ORIGIN: "*"
      # Optional bootstrap LLM (BYOK) — otherwise configure in the web UI:
      # LLM_BASE_URL: http://host.docker.internal:11434/v1
      # LLM_CHAT_MODEL: llama3.1
      # LLM_EMBED_MODEL: nomic-embed-text
      # Optional RAGFlow retrieval integration:
      # RAGFLOW_URL: http://host.docker.internal:9380
      # RAGFLOW_API_KEY: ragflow-xxxx
      SEED_DEMO: ${SEED_DEMO:-0}
    volumes:
      - server_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${SET_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # Optional local LLM (docker compose --profile ollama up -d)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  db_data:
  server_data:
  ollama_data:
